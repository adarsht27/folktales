[project]
name = "folktales"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gensim>=4.4.0",
    "nltk>=3.10.4",
    "spacy>=3.8.18",
]

[project.optional-dependencies]
topics = [
    "bertopic>=0.17.4",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
